name: SDK probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: |
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          H=$SDK/System/Library/Frameworks/UIKit.framework/Headers
          ls $H | grep -i tab | tr '\n' ' ' | xargs -I{} echo "::warning title=files::{}"
          grep -rnh -i "sidebar" $H/UITabBarController*.h $H/UITab*.h 2>/dev/null | grep -v "^\s*//" | grep -vi "UNAVAILABLE(tvos" | head -45 | while IFS= read -r l; do echo "::warning title=sb::${l:0:300}"; done
