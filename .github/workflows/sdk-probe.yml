name: SDK probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: |
          set +e +o pipefail
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          H=$SDK/System/Library/Frameworks/UIKit.framework/Headers
          echo "::warning title=files::$(ls $H | grep -i tab | tr '\n' ' ')"
          grep -v "^ *//" $H/UITabBarControllerSidebar.h | grep -v "^ *$" | grep -v "^#" | head -60 | while IFS= read -r l; do echo "::warning title=h::${l:0:300}"; done
          grep -n -i "tvos\|automatic\|group" $H/UITabBarController.h | head -30 | while IFS= read -r l; do echo "::warning title=tbc::${l:0:300}"; done
          exit 0
