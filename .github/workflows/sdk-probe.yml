name: SDK probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: |
          set +e +o pipefail
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          H=$SDK/System/Library/Frameworks/UIKit.framework/Headers
          echo "::warning title=files::$(ls $H | grep -i tab | tr '\n' ' ')"
          grep -h -i "sidebar" $H/UITab*.h > /tmp/sb.txt
          grep -v "UNAVAILABLE(tvos" /tmp/sb.txt | grep -v "^ *///" | head -45 | while IFS= read -r l; do echo "::warning title=sb::${l:0:300}"; done
          exit 0
