name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: probe vlckit
        run: |
          url="https://download.videolan.org/cocoapods/prod/TVVLCKit-3.7.2-3e42ae47-79128878.tar.xz"
          curl -sfL "$url" -o tv.tar.xz
          mkdir tv && tar -xJf tv.tar.xz -C tv
          echo "::notice title=tree::$(find tv -maxdepth 4 -not -path '*/doc/*' -not -path '*Headers/*' | tr '\n' ' ' | head -c 3000)"
          echo "::notice title=bins::$(for b in $(find tv -name TVVLCKit -type f); do echo "$b: $(file -b "$b")"; done | tr '\n' ' ' | head -c 3000)"
          echo "::notice title=xcinfo::$(for p in $(find tv -path '*xcframework/Info.plist'); do plutil -convert json -o - "$p"; done | head -c 3000)"
          h=$(find tv -name VLCMediaPlayer.h | head -1)
          echo "::notice title=api::$(grep -n 'addPlaybackSlave\|^- (void)play\|^- (void)pause\|float position\|VLCTime \*time\|isPlaying\|state;' "$h" | tr '\n' ' ' | head -c 3000)"
          echo "::notice title=size::$(du -sh tv)"
