name: BTR unsigned tvOS IPA
on:
  workflow_dispatch:
    inputs:
      clean:
        description: '完全重新编译（不使用缓存）'
        type: boolean
        default: false
  push:
    branches: [btr-port]
  pull_request:
permissions:
  contents: read
concurrency:
  group: btr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 增量编译缓存：第三方库源码 + 编译中间结果。缓存键绑定 Xcode 版本和依赖版本，
      # 任一变化即从零编译；手动触发时可勾选「完全重新编译」跳过缓存。
      - name: Cache key
        id: cachekey
        run: |
          echo "xcode=$(xcodebuild -version | tr -d '\n' | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - name: Restore build cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v4
        with:
          path: |
            build/SourcePackages
            build/DerivedData
          key: btr-${{ steps.cachekey.outputs.xcode }}-${{ hashFiles('BilibiliLive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            btr-${{ steps.cachekey.outputs.xcode }}-${{ hashFiles('BilibiliLive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Restore source timestamps for incremental build
        continue-on-error: true
        run: |
          # checkout 会把所有文件时间改成当前时间，导致每次全部重编；按最后一次提交时间还原。
          cat > /tmp/mtime.py <<'PY'
          import os, subprocess, sys, traceback
          try:
              out = subprocess.check_output(["git", "-c", "core.quotePath=false", "log", "--format=T%ct", "--name-only"], text=True, errors="replace")
              seen, stamp = set(), None
              for line in out.splitlines():
                  if line.startswith("T") and line[1:].isdigit():
                      stamp = int(line[1:]); continue
                  if stamp and line and line not in seen and os.path.isfile(line):
                      seen.add(line); os.utime(line, (stamp, stamp))
              print(f"restored mtimes for {len(seen)} files")
          except Exception:
              print("::warning title=mtime::" + traceback.format_exc().replace("\n", " | ")[:900])
          PY
          python3 /tmp/mtime.py
      - name: Native policy and fault-injection tests
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/test-btr.sh 2>&1 | tee build/tests.log
      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild -version | tee build/toolchain.txt
          xcodebuild -project BilibiliLive.xcodeproj -scheme BilibiliLive \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -archivePath "$PWD/build/BTR.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -resultBundlePath "$PWD/build/Archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' SKIP_SWIFTFORMAT=YES archive 2>&1 | tee build/archive.log
      - name: Save build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            build/SourcePackages
            build/DerivedData
          key: btr-${{ steps.cachekey.outputs.xcode }}-${{ hashFiles('BilibiliLive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
      - name: Package unsigned IPA and matching source
        run: |
          set -euo pipefail
          test -d build/BTR.xcarchive/Products/Applications/BilibiliLive.app
          mkdir -p build/package/Payload
          ditto build/BTR.xcarchive/Products/Applications/BilibiliLive.app build/package/Payload/BilibiliLive.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' build/package/Payload/BilibiliLive.app/Info.plist | grep -x AppleTVOS
          (cd build/package && zip -qry ../ATV-BTR-unsigned.ipa Payload)
          git archive --format=zip --output=build/ATV-BTR-source.zip HEAD
          git rev-parse HEAD > build/source-commit.txt
          shasum -a 256 build/ATV-BTR-unsigned.ipa > build/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATV-BTR-unsigned
          if-no-files-found: error
          path: |
            build/ATV-BTR-unsigned.ipa
            build/ATV-BTR-source.zip
            build/source-commit.txt
            build/SHA256.txt
      - name: Surface failure details as annotations
        if: failure()
        run: |
          for f in build/tests.log build/archive.log; do
            [ -f "$f" ] || continue
            grep -E "error:|FAILED|PASS:|fatal" "$f" | grep -v "^\s*$" | tail -9 | while IFS= read -r line; do
              echo "::error title=$(basename $f)::${line:0:900}"
            done
            echo "::warning title=$(basename $f) tail::$(tail -c 900 "$f" | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTR-build-diagnostics
          path: |
            build/*.log
            build/toolchain.txt
            build/Archive.xcresult
